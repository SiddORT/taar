openapi: 3.0.3
info:
  title: ZARI ERP API
  version: 1.0.0
  description: >-
    Complete API reference for the ZARI ERP backend (Express 5 + PostgreSQL + Drizzle ORM).


    **Authentication.** Most endpoints require a Bearer JWT obtained from `POST /api/auth/login`. Send the token in the
    `Authorization: Bearer <token>` header.


    **Base path.** All endpoints are served under `/api`. The platform reverse proxy listens on port 80 in development
    and `$REPLIT_DOMAINS` in production.


    Auto-generated from `artifacts/api-server/src/routes/` — 436 endpoints across 45 modules. Request/response shapes
    are extracted from Zod schemas and route handler usage; where a shape could not be statically inferred, a permissive
    `object` is used.
  contact:
    name: Zari Embroideries
    email: admin@example.com
servers:
  - url: http://localhost
    description: Local dev (Replit shared proxy on :80)
  - url: https://{host}
    description: Production
    variables:
      host:
        default: your-app.replit.app
